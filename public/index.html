<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simplemente Gato</title>

  <!-- Fuente pixel "Press Start 2P" desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Encabezado con el título -->
  <header class="encabezado">
    <h1 class="titulo">Simplemente Gato</h1>
  </header>

  <!-- Cuerpo: recuadro con la imagen y botón para pedir otra -->
  <main class="contenido">
    <section class="marco" aria-label="Imagen de gato">
      <div class="marco__visor">
        <img id="imagen-gato" class="marco__imagen" alt="Gato aleatorio" hidden>
        <!-- Aquí se muestran mensajes: cargando, errores, etc. -->
        <p id="mensaje" class="marco__mensaje" role="status" aria-live="polite">Aquí aparecerá tu gato</p>
      </div>
    </section>

    <!-- Botones: pedir otro gato y silenciar el maullido -->
    <div class="controles">
      <button id="boton-gato" class="boton" type="button">Otro gato</button>
      <button id="boton-sonido" class="boton boton--icono" type="button" aria-pressed="false" aria-label="Silenciar maullido">🔊</button>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
